# Render blueprint: API + Postgres + static frontend. `render login && render up`
services:
  - type: web
    name: finguard-api
    env: python
    buildCommand: pip install -r requirements.txt && python data/generator.py && python src/train.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: finguard-db, property: connectionString }
  - type: pserv
    name: finguard-db
    env: postgres
    plan: free
  - type: web
    name: finguard-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService: { name: finguard-api, type: web, property: url }
