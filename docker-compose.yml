services:
  db:
    image: postgres:16-alpine
    environment: [POSTGRES_USER=finguard, POSTGRES_PASSWORD=finguard, POSTGRES_DB=finguard]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    ports: ["8000:8000"]
    environment: [DATABASE_URL=postgresql+psycopg2://finguard:finguard@db:5432/finguard]
    volumes: [./models:/app/models, ./data:/app/data]
    depends_on: [db]
  web:
    build:
      context: ./frontend
      args: [VITE_API_URL=http://localhost:8000]
    ports: ["5173:80"]
    depends_on: [api]

volumes: { pgdata: {} }
